<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>人際關係與協商 數位互動教學網</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-book-open-reader"></i> 期末考 28 題</h2>
            </div>
            <div class="sidebar-search">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="搜尋關鍵字...">
                </div>
            </div>
            <nav class="nav-list" id="navList">
                <!-- Navigation items will be dynamically generated here -->
            </nav>
            
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-titles">
                    <h1>人際關係與協商</h1>
                    <p class="subtitle">100% 依據課本原文・未濃縮完整版</p>
                </div>
                <div class="header-stats">
                    <span class="stat-badge"><i class="fa-solid fa-list-check"></i> 共 28 題問答題</span>
                </div>
            </header>

            <div class="content-wrapper" id="contentWrapper">
                <!-- Question Cards will be dynamically generated here -->
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
