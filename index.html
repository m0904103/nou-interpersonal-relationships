<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>人際關係與協商 (自動伴讀版)</title>
    <link rel="stylesheet" href="style.css?v=7">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-book-open-reader"></i> 期末考必考 22 題</h2>
            </div>
            <div class="sidebar-search">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="搜尋關鍵字...">
                </div>
            </div>
            <div class="nav-section-title">問答題 (共 12 題，佔 75%)</div>
            <nav class="nav-list" id="navList"></nav>
            <div class="nav-section-title">解釋名詞 (共 10 題，佔 25%)</div>
            <nav class="nav-list" id="glossaryNavList"></nav>
            
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-titles">
                    <h1>人際關係與協商</h1>
                    <p class="subtitle">V7.0 學系官方精準命中版・100% 依據課本原文</p>
                </div>
                <div class="stat-group">
                    <span class="stat-badge"><i class="fa-solid fa-list-check"></i> 12 題問答題 + 10 題解釋名詞</span>
                    <button class="skeleton-toggle-btn" id="skeletonToggleBtn" title="開啟/關閉衝刺骨架模式">
                        <i class="fa-solid fa-bolt"></i> 骨架模式
                    </button>
                </div>
            </header>

            <div class="section-divider">
                <h2><i class="fa-solid fa-pen-nib"></i> 第一部分：問答題 (共 12 題，佔 75%)</h2>
            </div>
            <div class="content-wrapper" id="contentWrapper"></div>
            
            <div class="section-divider">
                <h2><i class="fa-solid fa-book-open"></i> 第二部分：解釋名詞 (共 10 題，佔 25%)</h2>
            </div>
            <div class="content-wrapper" id="glossaryWrapper"></div>
        </main>
        <!-- Global Audio Player -->
        <div class="global-player">
            <div class="player-info">
                <span id="playerStatus">準備就緒</span>
            </div>
            <div class="player-controls">
                <button class="player-btn speed-toggle" id="speedBtn" title="播放速度">
                    <span style="font-weight:700; font-size:0.9rem;">1.0x</span>
                </button>
                <button class="player-btn loop-toggle" id="loopBtn" title="切換循環模式">
                    <i class="fa-solid fa-repeat"></i>
                </button>
                <button class="player-btn" id="prevBtn" title="上一題">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="player-btn play-pause-btn" id="playBtn" title="播放 / 暫停">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="player-btn" id="nextBtn" title="下一題">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="data.js?v=11"></script>
    <script src="app.js?v=12"></script>

</body>
</html>
